title: Your News Site
description: A news website like Sahafah.net
baseurl: ""
url: "" # Leave empty for GitHub Pages
permalink: /show:id.html

# Only use plugins supported by GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-paginate

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "_posts"
    values:
      layout: post

# Pagination (for index.html)
paginate: 10
paginate_path: "/page:num"
