<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبرك عندي - Yemen News</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            padding-top: 120px;
        }
        
        /* Header Styles */
        #site-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        
        .header-top {
            padding: 15px;
            background: #2c3e50;
            color: white;
        }
        
        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }
        
        .red { color: #e74c3c; }
        .green { color: #2ecc71; }
        
        .datetime {
            font-size: 0.9rem;
        }
        
        /* Navigation */
        .categories ul {
            display: flex;
            list-style: none;
            background: #34495e;
            padding: 0 15px;
        }
        
        .categories li a {
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            display: block;
            transition: background 0.3s;
        }
        
        .categories li a:hover, 
        .categories li a.active {
            background: #e74c3c;
        }
        
        /* Main Content */
        main {
            padding: 20px;
            min-height: calc(100vh - 200px);
        }
        
        .news-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #news-search {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        #news-sort {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .news-article {
            background: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .news-article:hover {
            transform: translateY(-5px);
        }
        
        .news-article h2 {
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #2c3e50;
        }
        
        .news-article p {
            padding: 0 15px 15px;
            color: #666;
            line-height: 1.5;
        }
        
        .article-meta {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f9f9f9;
            font-size: 0.8rem;
            color: #777;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            grid-column: 1 / -1;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e74c3c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Breaking News Ticker */
        .breaking-news-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #e74c3c;
            color: white;
            z-index: 1000;
            direction: rtl;
        }
        
        .breaking-news-ticker {
            padding: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .ticker-label {
            background: #c0392b;
            padding: 3px 10px;
            border-radius: 3px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-right: 120px;
            animation: ticker 30s linear infinite;
        }
        
        .ticker-item {
            display: inline-block;
            padding: 0 20px;
            position: relative;
            cursor: pointer;
        }
        
        .ticker-item:not(:last-child):after {
            content: "⚡";
            color: #ffcc00;
            position: absolute;
            left: -5px;
        }
        
        @keyframes ticker {
            0% { transform: translateX(30%); }
            100% { transform: translateX(-100%); }
        }
        
        /* Article Viewer */
        .article-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 1001;
            display: none;
        }
        
        .article-header {
            background: #2c3e50;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .return-main-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #article-frame {
            width: 100%;
            height: calc(100% - 60px);
            border: none;
        }
        
        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding-top: 160px;
            }
            
            .news-container {
                grid-template-columns: 1fr;
            }
            
            .news-filters {
                flex-direction: column;
            }
            
            .ticker-item {
                padding: 0 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header id="site-header">
        <div class="header-top">
            <div class="logo-container">
                <div class="logo">
                    <span class="red">خبرك</span>
                    <span class="green">عندي</span>
                </div>
                <div class="datetime" id="current-datetime">
                    <i class="icon-clock"></i> جاري التحميل...
                </div>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="categories">
            <ul>
                <li><a href="#" class="active" data-category="all">الرئيسية</a></li>
                <li><a href="#" data-category="local">محلية</a></li>
                <li><a href="#" data-category="international">دولية</a></li>
                <li><a href="#" data-category="sports">رياضة</a></li>
                <li><a href="#" data-category="economic">اقتصادية</a></li>
                <li><a href="private.html" data-category="private">خاصة</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <div class="news-filters">
            <input type="text" id="news-search" placeholder="ابحث في الأخبار...">
            <select id="news-sort">
                <option value="newest">الأحدث أولاً</option>
                <option value="oldest">الأقدم أولاً</option>
            </select>
        </div>
        
        <div class="news-container" id="news-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل الأخبار اليمنية...</p>
            </div>
        </div>
        
        <div class="load-more-container">
            <button id="load-more" class="load-more-btn">عرض المزيد من الأخبار</button>
        </div>
    </main>

    <!-- Article Viewer -->
    <div class="article-viewer" id="article-viewer">
        <div class="article-header">
            <button class="return-main-btn" onclick="closeArticle()">← العودة إلى الرئيسية</button>
            <div class="article-logo">
                <span class="red">خبرك</span>
                <span class="green">عندي</span>
            </div>
        </div>
        <iframe id="article-frame" src=""></iframe>
    </div>

    <!-- Footer -->
    <footer id="site-footer">
        <div class="footer-bottom">
            <p>جميع الحقوق محفوظة © <span id="current-year">2023</span> موقع خبرك عندي</p>
            <p>آخر تحديث: <span id="last-updated">جاري التحميل...</span></p>
        </div>
    </footer>

    <!-- Breaking News Ticker -->
    <div class="breaking-news-container">
        <div class="breaking-news-ticker">
            <div class="ticker-label">أخبار عاجلة:</div>
            <div class="ticker-content" id="breaking-news-ticker">
                <span class="ticker-item">جاري تحميل آخر الأخبار...</span>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Simple News Loading (replace with your actual implementation)
        document.addEventListener('DOMContentLoaded', function() {
            // Set current year
            document.getElementById('current-year').textContent = new Date().getFullYear();
            
            // Update datetime
            function updateDateTime() {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                };
                const dateStr = now.toLocaleDateString('ar-EG', options);
                document.getElementById('current-datetime').textContent = dateStr;
                document.getElementById('last-updated').textContent = now.toLocaleTimeString('ar-EG');
            }
            updateDateTime();
            setInterval(updateDateTime, 60000);
            
            // Simulate news loading
            setTimeout(function() {
                const newsContainer = document.getElementById('news-container');
                newsContainer.innerHTML = `
                    <div class="news-article">
                        <h2 onclick="viewArticle('news1.html', 'عنوان الخبر الأول')">عنوان الخبر الأول</h2>
                        <p>محتوى مختصر للخبر الأول هنا...</p>
                        <div class="article-meta">
                            <span class="source">مصدر الخبر</span>
                            <span class="date">${new Date().toLocaleString('ar-EG')}</span>
                        </div>
                    </div>
                    <div class="news-article">
                        <h2 onclick="viewArticle('news2.html', 'عنوان الخبر الثاني')">عنوان الخبر الثاني</h2>
                        <p>محتوى مختصر للخبر الثاني هنا...</p>
                        <div class="article-meta">
                            <span class="source">مصدر الخبر</span>
                            <span class="date">${new Date().toLocaleString('ar-EG')}</span>
                        </div>
                    </div>
                `;
                
                // Update breaking news
                document.getElementById('breaking-news-ticker').innerHTML = `
                    <span class="ticker-item" onclick="viewArticle('news1.html', 'عنوان الخبر الأول')">⚡ عنوان الخبر الأول</span>
                    <span class="ticker-item" onclick="viewArticle('news2.html', 'عنوان الخبر الثاني')">⚡ عنوان الخبر الثاني</span>
                `;
            }, 1500);
        });
        
        // Article Viewer Functions
        function viewArticle(url, title) {
            // Generate clean URL
            const articleId = url.match(/\d+/) || Math.floor(Math.random() * 10000);
            history.pushState({}, '', `/show/${articleId}.html`);
            
            // Show article
            document.getElementById('article-frame').src = url;
            document.getElementById('article-viewer').style.display = 'block';
            document.title = `${title} - خبرك عندي`;
        }
        
        function closeArticle() {
            document.getElementById('article-viewer').style.display = 'none';
            document.getElementById('article-frame').src = '';
            history.pushState({}, '', '/');
            document.title = 'خبرك عندي - Yemen News';
        }
        
        // Handle back button
        window.addEventListener('popstate', function() {
            if (!window.location.pathname.includes('/show/')) {
                closeArticle();
            }
        });
    </script>
</body>
</html>
