<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبرك عندي - Yemen News</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Enhanced Breaking News Ticker Styles */
        .breaking-news-container {
            position: sticky;
            bottom: 0;
            z-index: 1000;
            background-color: #e74c3c;
            direction: rtl;
        }
        .breaking-news-ticker {
            color: white;
            padding: 12px 10px;
            overflow: hidden;
            position: relative;
            font-weight: bold;
        }
        .ticker-label {
            display: inline-block;
            background: #c0392b;
            padding: 3px 10px;
            margin-left: 15px;
            border-radius: 3px;
            position: absolute;
            right: 0;
            z-index: 2;
        }
        .ticker-content {
            display: inline-block;
            padding-right: 120px;
            white-space: nowrap;
            animation: ticker 30s linear infinite;
        }
        .ticker-item {
            display: inline-block;
            padding: 0 15px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }
        .ticker-item:not(:last-child):after {
            content: "⚡";
            color: #ffcc00;
            position: absolute;
            left: -5px;
            text-shadow: 0 0 3px #ff0000;
        }
        .ticker-item:hover {
            color: #ffcc00;
        }
        @keyframes ticker {
            0% { transform: translateX(30%); }
            100% { transform: translateX(-100%); }
        }
        
        main {
            margin-bottom: 50px;
        }
        
        /* Article Viewer Header */
        .article-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
            padding: 15px;
            z-index: 1001;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .return-main-btn {
            order: 1;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: auto;
        }
        .article-logo {
            order: 2;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            margin-left: auto;
        }
        .article-logo .red { color: #e74c3c; }
        .article-logo .green { color: #2ecc71; }
        
        /* Article Viewer */
        .article-viewer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            z-index: 1000;
            display: none;
        }
        #article-frame {
            width: 100%;
            height: calc(100% - 60px);
            margin-top: 60px;
            border: none;
        }
        
        /* Article Toolbar */
        .article-toolbar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            border-radius: 50px;
            padding: 10px;
            z-index: 1002;
            display: flex;
            gap: 10px;
        }
        .toolbar-btn {
            background: #2c3e50;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Dark Mode */
        body.dark-mode {
            background: #121212;
            color: #f0f0f0;
        }
        body.dark-mode .article-viewer {
            background: #1e1e1e;
        }
        
        /* Loading Indicator */
        .iframe-loading {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1002;
        }
        .iframe-loading .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e74c3c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body { padding-top: 160px; }
            .article-header {
                flex-direction: row;
            }
            .ticker-item {
                padding: 0 10px;
                font-size: 0.9em;
            }
            .ticker-item:after {
                left: -3px !important;
            }
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header id="site-header">
        <div class="header-top">
            <div class="logo-container">
                <div class="logo">
                    <span class="red">خبرك</span>
                    <span class="green">عندي</span>
                </div>
                <div class="datetime" id="current-datetime">
                    <i class="icon-clock"></i> جاري التحميل...
                </div>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="categories">
            <ul>
                <li><a href="#" class="active" data-category="all">الرئيسية</a></li>
                <li><a href="#" data-category="local">محلية</a></li>
                <li><a href="#" data-category="international">دولية</a></li>
                <li><a href="#" data-category="sports">رياضة</a></li>
                <li><a href="#" data-category="economic">اقتصادية</a></li>
                <li><a href="private.html" data-category="private">خاصة</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <div class="news-filters">
            <input type="text" id="news-search" placeholder="ابحث في الأخبار...">
            <select id="news-sort">
                <option value="newest">الأحدث أولاً</option>
                <option value="oldest">الأقدم أولاً</option>
            </select>
        </div>
        
        <div class="news-container" id="news-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل الأخبار اليمنية...</p>
            </div>
        </div>
        
        <div class="pagination" id="pagination">
            <button class="prev" disabled>السابق</button>
            <div class="pages" id="page-numbers"></div>
            <button class="next">التالي</button>
        </div>
        
        <div class="load-more-container">
            <button id="load-more" class="load-more-btn">عرض المزيد من الأخبار</button>
        </div>
    </main>

    <!-- Article Viewer -->
    <div class="article-viewer" id="article-viewer">
        <div class="article-header">
            <button class="return-main-btn" onclick="closeArticle()">← العودة إلى الرئيسية</button>
            <div class="article-logo">
                <span class="red">خبرك</span>
                <span class="green">عندي</span>
            </div>
        </div>
        <iframe id="article-frame" src=""></iframe>
    </div>
    <div class="article-toolbar">
        <button class="toolbar-btn" onclick="adjustTextSize('increase')">A+</button>
        <button class="toolbar-btn" onclick="adjustTextSize('decrease')">A-</button>
        <button class="toolbar-btn" onclick="toggleDarkMode()">☀</button>
        <button class="toolbar-btn" onclick="printArticle()">🖶</button>
    </div>

    <!-- Footer -->
    <footer id="site-footer">
        <div class="footer-bottom">
            <p>جميع الحقوق محفوظة © <span id="current-year">2023</span> موقع خبرك عندي</p>
            <p>آخر تحديث: <span id="last-updated">جاري التحميل...</span></p>
        </div>
    </footer>

    <!-- Breaking News Ticker -->
    <div class="breaking-news-container">
        <div class="breaking-news-ticker">
            <div class="ticker-label">أخبار عاجلة:</div>
            <div class="ticker-content" id="breaking-news-ticker">
                <span class="ticker-item">جاري تحميل آخر الأخبار...</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="js/utils.js"></script>
    <script src="js/news-loader.js"></script>
    <script src="js/search.js"></script>
    <script src="js/pagination.js"></script>

    <!-- Main Script -->
    <script>
        // Store articles in memory
        let allArticles = [];
        
        // Current Date and Time
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            const dateStr = now.toLocaleDateString('ar-EG', options)
                .replace(/،/g, ' - ')
                .replace(/ص/g, 'ص')
                .replace(/م/g, 'م');

            document.getElementById('current-datetime').innerHTML = 
                `<i class="icon-clock"></i> ${dateStr}`;
        }

        // Enhanced Article Viewer with Clean URLs
        function viewArticle(url, title) {
            // Show loading indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'iframe-loading';
            loadingDiv.innerHTML = '<div class="spinner"></div>';
            document.body.appendChild(loadingDiv);
            
            // Find article in our stored data
            const article = allArticles.find(a => a.url === url);
            
            // Generate a unique ID
            const articleId = article ? 
                article.url.match(/\d+/)[0] || 
                Math.floor(Math.random() * 10000).toString().padStart(4, '0');
            
            // Update browser URL
            window.history.pushState(
                { articleUrl: url, articleTitle: title }, 
                title, 
                `/show/${articleId}.html`
            );
            
            // Load article
            const iframe = document.getElementById('article-frame');
            iframe.onload = function() {
                document.body.removeChild(loadingDiv);
            };
            iframe.src = url;
            
            // Show viewer
            document.getElementById('article-viewer').style.display = 'block';
            document.body.style.overflow = 'hidden';
            document.title = `${title} - خبرك عندي`;
        }

        function closeArticle() {
            document.getElementById('article-viewer').style.display = 'none';
            document.getElementById('article-frame').src = '';
            document.body.style.overflow = 'auto';
            document.title = 'خبرك عندي - Yemen News';
            window.history.pushState({}, '', '/');
        }

        // Handle browser navigation
        window.addEventListener('popstate', function(event) {
            if (event.state && event.state.articleUrl) {
                viewArticle(event.state.articleUrl, event.state.articleTitle);
            } else {
                closeArticle();
            }
        });

        // Check URL on load
        function checkInitialURL() {
            const pathMatch = window.location.pathname.match(/\/show\/(\d+)\.html$/);
            if (pathMatch) {
                const articleId = pathMatch[1];
                const article = allArticles.find(a => a.url.includes(articleId));
                if (article) {
                    viewArticle(article.url, article.title);
                } else {
                    window.location.href = '/';
                }
            }
        }

        // Article Tools
        function adjustTextSize(action) {
            const frame = document.getElementById('article-frame');
            if (frame.contentDocument) {
                const currentSize = parseInt(frame.contentDocument.body.style.fontSize || 16);
                frame.contentDocument.body.style.fontSize = 
                    (action === 'increase' ? currentSize + 2 : currentSize - 2) + 'px';
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const frame = document.getElementById('article-frame');
            if (frame.contentDocument) {
                frame.contentDocument.body.classList.toggle('dark-mode');
            }
        }

        function printArticle() {
            const frame = document.getElementById('article-frame');
            if (frame.contentWindow) {
                frame.contentWindow.print();
            }
        }

        // Breaking News Ticker
        function updateBreakingNews() {
            if (allArticles.length >= 3) {
                const latestArticles = allArticles.slice(0, 3);
                const tickerContent = latestArticles.map(article => {
                    return `<span class="ticker-item" onclick="viewArticle('${article.url}', '${article.title.replace(/'/g, "\\'")}')">⚡ ${article.title}</span>`;
                }).join('');

                const ticker = document.getElementById('breaking-news-ticker');
                ticker.innerHTML = tickerContent;
                ticker.style.animation = 'none';
                void ticker.offsetWidth;
                ticker.style.animation = 'ticker 30s linear infinite';
            }
        }

        // News Search Functionality
        document.getElementById('news-search').addEventListener('input', function(e) {
            if (typeof filterNews === 'function') {
                filterNews(e.target.value);
            }
        });

        // Sort News Functionality
        document.getElementById('news-sort').addEventListener('change', function(e) {
            if (typeof sortNews === 'function') {
                sortNews(e.target.value);
            }
        });

        // Load More News Button
        document.getElementById('load-more').addEventListener('click', function() {
            if (typeof loadMoreNews === 'function') {
                loadMoreNews();
            }
        });

        // Initialize Page
        document.addEventListener('DOMContentLoaded', function() {
            // Set current year
            document.getElementById('current-year').textContent = new Date().getFullYear();
            
            // Initial date/time update
            updateDateTime();
            
            // Load news
            fetch('data/news.json')
                .then(response => response.json())
                .then(news => {
                    allArticles = news.articles.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    // Render articles
                    const newsContainer = document.getElementById('news-container');
                    newsContainer.innerHTML = '';
                    
                    allArticles.forEach(item => {
                        const article = document.createElement('div');
                        article.className = 'news-article';
                        article.innerHTML = `
                            <h2 onclick="viewArticle('${item.url}', '${item.title.replace(/'/g, "\\'")}')">
                                ${item.title}
                            </h2>
                            <p>${item.summary || ''}</p>
                            <div class="article-meta">
                                <span class="source">${item.source}</span>
                                <span class="date">${new Date(item.date).toLocaleString('ar-EG')}</span>
                            </div>
                        `;
                        newsContainer.appendChild(article);
                    });
                    
                    // Update last updated time
                    document.getElementById('last-updated').textContent = 
                        new Date().toLocaleTimeString('ar-EG');
                    
                    // Update breaking news
                    updateBreakingNews();
                    
                    // Check if we loaded an article URL directly
                    checkInitialURL();
                })
                .catch(error => {
                    console.error('Error loading news:', error);
                    document.getElementById('news-container').innerHTML = 
                        '<p class="error">حدث خطأ أثناء تحميل الأخبار. يرجى المحاولة لاحقاً.</p>';
                });
            
            // Set intervals for updates
            setInterval(updateDateTime, 60000);
            setInterval(updateBreakingNews, 300000);
            
            // Initialize pagination
            if (typeof initPagination === 'function') {
                initPagination();
            }
        });
    </script>
</body>
</html>
