<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبرك عندي - Yemen News</title>
    <style>
        /* Basic Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: #f5f5f5;
            padding-top: 120px;
        }
        
        /* Header Styles */
        #site-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        
        .header-top {
            padding: 15px;
            background: #2c3e50;
            color: white;
        }
        
        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .red { color: #e74c3c; }
        .green { color: #2ecc71; }
        
        .datetime {
            font-size: 0.9rem;
        }
        
        /* Article Viewer Header */
        .article-viewer-header {
            position: fixed;
            top: 0;
            width: 100%;
            background: #2c3e50;
            color: white;
            padding: 15px;
            z-index: 1001;
            display: none;
            justify-content: space-between;
            align-items: center;
        }
        
        .return-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* Navigation */
        .categories ul {
            display: flex;
            list-style: none;
            background: #34495e;
            padding: 0 15px;
        }
        
        .categories li a {
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            display: block;
            transition: background 0.3s;
        }
        
        .categories li a:hover, 
        .categories li a.active {
            background: #e74c3c;
        }
        
        /* Main Content */
        main {
            padding: 20px;
            min-height: calc(100vh - 200px);
        }
        
        .news-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        #news-search {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        #news-sort {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .news-article {
            background: white;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .news-article:hover {
            transform: translateY(-5px);
        }
        
        .news-article h2 {
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            color: #2c3e50;
        }
        
        .news-article p {
            padding: 0 15px 15px;
            color: #666;
            line-height: 1.5;
            display: none; /* Hide summary if empty */
        }
        
        .news-article p:not(:empty) {
            display: block; /* Show summary if not empty */
        }
        
        .article-meta {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: #f9f9f9;
            font-size: 0.8rem;
            color: #777;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            grid-column: 1 / -1;
        }
        
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #e74c3c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Breaking News Ticker */
        .breaking-news-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #e74c3c;
            color: white;
            z-index: 1000;
            direction: rtl;
        }
        
        .breaking-news-ticker {
            padding: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .ticker-label {
            background: #c0392b;
            padding: 3px 10px;
            border-radius: 3px;
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-right: 120px;
            animation: ticker 30s linear infinite;
        }
        
        .ticker-item {
            display: inline-block;
            padding: 0 20px;
            position: relative;
            cursor: pointer;
        }
        
        .ticker-item:not(:last-child):after {
            content: "⚡";
            color: #ffcc00;
            position: absolute;
            left: -5px;
        }
        
        @keyframes ticker {
            0% { transform: translateX(30%); }
            100% { transform: translateX(-100%); }
        }
        
        /* Footer */
        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding-top: 160px;
            }
            
            .news-container {
                grid-template-columns: 1fr;
            }
            
            .news-filters {
                flex-direction: column;
            }
            
            .ticker-item {
                padding: 0 10px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <!-- Main Header -->
    <header id="site-header">
        <div class="header-top">
            <div class="logo-container">
                <div class="logo" onclick="window.location.href='/'">
                    <span class="red">خبرك</span>
                    <span class="green">عندي</span>
                </div>
                <div class="datetime" id="current-datetime">
                    <i class="icon-clock"></i> جاري التحميل...
                </div>
            </div>
        </div>
        
        <!-- Navigation -->
        <nav class="categories">
            <ul>
                <li><a href="#" class="active" data-category="all">الرئيسية</a></li>
                <li><a href="#" data-category="local">محلية</a></li>
                <li><a href="#" data-category="international">دولية</a></li>
                <li><a href="#" data-category="sports">رياضة</a></li>
                <li><a href="#" data-category="economic">اقتصادية</a></li>
                <li><a href="private.html" data-category="private">خاصة</a></li>
            </ul>
        </nav>
    </header>

    <!-- Article Viewer Header -->
    <div class="article-viewer-header" id="article-viewer-header">
        <button class="return-btn" onclick="window.location.href='/'">← العودة للصفحة الرئيسية</button>
        <div class="logo" onclick="window.location.href='/'">
            <span class="red">خبرك</span>
            <span class="green">عندي</span>
        </div>
    </div>

    <!-- Main Content -->
    <main id="main-content">
        <div class="news-filters">
            <input type="text" id="news-search" placeholder="ابحث في الأخبار...">
            <select id="news-sort">
                <option value="newest">الأحدث أولاً</option>
                <option value="oldest">الأقدم أولاً</option>
            </select>
        </div>
        
        <div class="news-container" id="news-container">
            <div class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل الأخبار اليمنية...</p>
            </div>
        </div>
        
        <div class="load-more-container">
            <button id="load-more" class="load-more-btn">عرض المزيد من الأخبار</button>
        </div>
    </main>

    <!-- Footer -->
    <footer id="site-footer">
        <div class="footer-bottom">
            <p>جميع الحقوق محفوظة © <span id="current-year">2023</span> موقع خبرك عندي</p>
            <p>آخر تحديث: <span id="last-updated">جاري التحميل...</span></p>
        </div>
    </footer>

    <!-- Breaking News Ticker -->
    <div class="breaking-news-container">
        <div class="breaking-news-ticker">
            <div class="ticker-label">أخبار عاجلة:</div>
            <div class="ticker-content" id="breaking-news-ticker">
                <span class="ticker-item">جاري تحميل آخر الأخبار...</span>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Helper function to escape HTML
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Article viewing function with redirection
        function viewArticle(url, title) {
            // Show article viewer header
            document.getElementById('article-viewer-header').style.display = 'flex';
            document.getElementById('site-header').style.display = 'none';
            
            // Open the article in a new tab
            window.open(url, '_blank');
            
            // Update page title
            document.title = `${title} - خبرك عندي`;
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Set current year
            document.getElementById('current-year').textContent = new Date().getFullYear();
            
            // Update datetime
            function updateDateTime() {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                };
                const dateStr = now.toLocaleDateString('ar-EG', options)
                    .replace(/،/g, ' - ')
                    .replace(/ص/g, 'ص')
                    .replace(/م/g, 'م');

                document.getElementById('current-datetime').innerHTML = 
                    `<i class="icon-clock"></i> ${dateStr}`;
                document.getElementById('last-updated').textContent = now.toLocaleTimeString('ar-EG');
            }
            updateDateTime();
            setInterval(updateDateTime, 60000);
            
            // Load news from JSON
            function loadNews() {
                fetch('data/news.json')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(newsData => {
                        displayNews(newsData.articles);
                        updateBreakingNews(newsData.articles.slice(0, 3));
                    })
                    .catch(error => {
                        console.error('Error loading news:', error);
                        document.getElementById('news-container').innerHTML = `
                            <div class="error" style="grid-column:1/-1;text-align:center;padding:20px;color:red">
                                حدث خطأ في تحميل الأخبار. يرجى المحاولة لاحقاً.
                            </div>
                        `;
                    });
            }
            
            // Display news articles
            function displayNews(articles) {
                const newsContainer = document.getElementById('news-container');
                
                if (!articles || articles.length === 0) {
                    newsContainer.innerHTML = `
                        <div style="grid-column:1/-1;text-align:center;padding:20px;">
                            لا توجد أخبار متاحة حالياً.
                        </div>
                    `;
                    return;
                }
                
                // Sort by date (newest first)
                const sortedArticles = [...articles].sort((a, b) => {
                    return new Date(b.date) - new Date(a.date);
                });
                
                newsContainer.innerHTML = sortedArticles.map(article => {
                    const summaryHtml = article.summary ? `<p>${article.summary}</p>` : '';
                    return `
                    <div class="news-article">
                        <h2 onclick="viewArticle('${escapeHtml(article.url)}', '${escapeHtml(article.title)}')">
                            ${article.title}
                        </h2>
                        ${summaryHtml}
                        <div class="article-meta">
                            <span class="source">${article.source || 'مصدر غير معروف'}</span>
                            <span class="date">${formatDate(article.date)}</span>
                        </div>
                    </div>
                    `;
                }).join('');
            }
            
            // Format date
            function formatDate(dateString) {
                try {
                    const date = new Date(dateString);
                    return date.toLocaleString('ar-EG');
                } catch (e) {
                    return dateString || 'تاريخ غير معروف';
                }
            }
            
            // Update breaking news ticker
            function updateBreakingNews(articles) {
                const ticker = document.getElementById('breaking-news-ticker');
                
                if (!articles || articles.length === 0) {
                    ticker.innerHTML = '<span class="ticker-item">لا توجد أخبار عاجلة</span>';
                    return;
                }
                
                ticker.innerHTML = articles.map(article => `
                    <span class="ticker-item" onclick="viewArticle('${escapeHtml(article.url)}', '${escapeHtml(article.title)}')">
                        ⚡ ${article.title}
                    </span>
                `).join('');
                
                // Restart animation
                ticker.style.animation = 'none';
                void ticker.offsetWidth;
                ticker.style.animation = 'ticker 30s linear infinite';
            }
            
            // Handle back button
            window.addEventListener('popstate', function() {
                document.getElementById('article-viewer-header').style.display = 'none';
                document.getElementById('site-header').style.display = 'block';
                document.title = 'خبرك عندي - Yemen News';
            });

            // Load More News Button
            document.getElementById('load-more').addEventListener('click', function() {
                // Implement your load more functionality here
                alert('سيتم تحميل المزيد من الأخبار');
            });

            // News Search Functionality
            document.getElementById('news-search').addEventListener('input', function(e) {
                // Implement search functionality here
                console.log('Searching for:', e.target.value);
            });

            // Sort News Functionality
            document.getElementById('news-sort').addEventListener('change', function(e) {
                // Implement sort functionality here
                console.log('Sorting by:', e.target.value);
            });
            
            // Initial load
            loadNews();
        });
    </script>
</body>
</html>
