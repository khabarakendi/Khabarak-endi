              'https://sedda.news/feed',
              'https://albiladn.net/feed',
              'https://althawra-news.net/index.php/feed',
              'https://barran.press/feed',
              'https://yemenfuture.net/feed',
              'https://24-post.com/feed',
              'https://ye-voice.com/feed',
              'https://ghamdannews.com/index.php/feed',
              'https://al-awal.net/feed',
              'https://mandabpress.com/feed',
              'https://www.yemenisofamerica.com/feed',
              'https://yemennownews.com/feed',
              'https://www.24-post.com/feed',
              'https://bawabatii.net/feed',
              'https://www.yemen-arabic.com/feed',
              'https://www.sahafah.net/feed',
              'https://almahranews.com/feed',
              'https://almahriah.net/feed',
              'https://www.anbaaden.com/feed',
              'https://huna-aden.com/feed',
              'https://taiztoday.net/feed',
              'https://www.lahjnews.net/news/feed',
              'https://almasdaronline.com/feed',
              'https://www.marebpress.net/feed',
              'https://www.yemeneconomist.com/feed',
              'https://yemen-press.net/feed',
              'https://alsahwa-yemen.net/feed',
              'https://sa24.co/feed',
              'https://www.awraqpress.net/portal/feed',
              'https://almethaq.net/news/feed',
              'https://www.saba.ye/ar/feed',
              'https://www.yemeninews.net/feed',
              'https://al-omana.net/feed',
              'https://khabaragency.net/feed',
              'https://albaath-ye.net/feed',
              'https://www.ibb-news.com/feed',
              'https://www.dhala.net/feed',
              'https://www.26sep.net/feed',
              'https://www.adngad.net/feed',
              'https://crater-news.net/feed',
              'https://crater-sky.net/feed'
          ]
          
          def get_feed(url):
              try:
                  headers = {'User-Agent': 'Mozilla/5.0'}
                  response = requests.get(url, headers=headers, timeout=10)
                  return feedparser.parse(response.content)
              except Exception as e:
                  print(f'Error fetching {url}: {str(e)}')
                  return None
                  
          # Load existing news if available
          existing_articles = []
          if os.path.exists('data/news.json'):
              with open('data/news.json', 'r', encoding='utf-8') as f:
                  try:
                      existing_data = json.load(f)
                      existing_articles = existing_data.get('articles', [])
                  except:
                      existing_articles = []
          
          new_articles = []
          for feed_url in FEEDS:
              feed = get_feed(feed_url)
              if feed and feed.entries:
                  for entry in feed.entries[:30]:
                      try:
                          new_article = {
                              'title': BeautifulSoup(entry.title, 'html.parser').get_text(),
                              'url': entry.link,
                              'source': feed_url.split('//')[1].split('/')[0],
                              'date': datetime.utcnow().isoformat() + 'Z'
                          }
                          
                          # Only add if not already in existing articles
                          if not any(a['url'] == new_article['url'] for a in existing_articles):
                              new_articles.append(new_article)
                      except Exception as e:
                          print(f'Error processing entry from {feed_url}: {str(e)}')
                          continue
                          
          # Combine new and existing articles (new ones first)
          all_articles = new_articles + existing_articles
          
          # Keep only the last 500 articles to prevent file size issues
          all_articles = all_articles[:500]
          
          with open('data/news.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'lastUpdated': datetime.utcnow().isoformat() + 'Z',
                  'articles': all_articles
              }, f, ensure_ascii=False, indent=2)
          "
      # Step 5: Commit and push changes
      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Check for changes
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Stage and commit changes
          git add data/news.json
          git commit -m "Auto-update news [skip ci]"
          
          # Push changes (force push if needed)
          git fetch origin
          git rebase origin/main
          git push origin HEAD:main
