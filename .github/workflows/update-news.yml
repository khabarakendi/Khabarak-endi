name: Update News

on:
  schedule:
    - cron: '*/5 * * * *'  # Run every 5 minutes
  workflow_dispatch:       # Allow manual trigger

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser beautifulsoup4 requests  # Fixed missing dependency

      - name: Run fetch_news.py
        run: python fetch_news.py  # Make sure this script writes valid JSON to data/news.json

      - name: Commit and push changes (Fixed Version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git reset --hard origin/main  # Avoids rebase failures

          git add data/news.json
          git commit -m "🔄 Auto-update news articles" || echo "No new articles to commit, forcing push"
          git push --force || echo "Push failed, check logs"
