name: Update View Counts
on:
  repository_dispatch:
    types: [update_views]
jobs:
  update_views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get install -y jq
      - name: Update counts
        run: |
          ARTICLE_ID=${{ github.event.client_payload.articleId }}
          wget -O views.json https://raw.githubusercontent.com/khabarakendi/khabarak-endi/main/data/views.json
          jq --arg id "$ARTICLE_ID" '.[$id] = (.[$id] // 0) + 1' views.json > updated.json
          mv updated.json data/views.json
      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/views.json
          git commit -m "Update views for article ${{ github.event.client_payload.articleId }}"
          git push
